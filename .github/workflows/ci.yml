name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=mini_aec_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build

      - name: Validate Compose configuration
        if: matrix.python-version == '3.12'
        env:
          MINI_AEC_SERVICE_API_KEY: ci-validation-key-not-for-production # pragma: allowlist secret
        run: docker compose config --quiet

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          enable-cache: true

      - name: Install security tools
        run: uv sync --locked --extra security

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file audit-requirements.txt
          uv run pip-audit --requirement audit-requirements.txt

      - name: Scan Python code
        run: uv run bandit -r src rag evaluation scripts agent.py tools.py main.py -q

      - name: Scan committed files for secrets
        run: |
          uv run detect-secrets scan --baseline .secrets.baseline --force-use-all-plugins
          git diff --exit-code -- .secrets.baseline

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MINI_AEC_SERVICE_API_KEY: ci-container-key-not-for-production # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag mini-aec-agent:ci .
      - name: Smoke-test production image
        run: |
          docker run --detach --name mini-aec-agent-ci \
            --env MINI_AEC_SERVICE_API_KEY \
            --publish 127.0.0.1:18000:8000 \
            mini-aec-agent:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              curl --fail --silent \
                --header "X-API-Key: ${MINI_AEC_SERVICE_API_KEY}" \
                http://127.0.0.1:18000/v1/system
              exit 0
            fi
            sleep 1
          done
          docker logs mini-aec-agent-ci
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force mini-aec-agent-ci || true
